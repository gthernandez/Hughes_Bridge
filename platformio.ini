; hughes_bridge -- Hughes Power Watchdog (Gen 1, 50A) BLE -> WiFi/HTTP bridge
; Target: Hosyond ESP32-S3 2.8" module (generic esp32-s3).
;
; Every per-board setting that used to live in the Arduino IDE's memory -- flash
; layout, the "USB CDC On Boot" toggle, the core version -- lives HERE now and
; travels with the project. That is the whole reason this one is PlatformIO.
;
; pioarduino platform (not the official espressif32) because we need Arduino
; core 3.x, which pairs with NimBLE-Arduino 2.x -- the SAME BLE stack the fleet
; already proved on easytouch_bridge. The official platform still lags on core 3.
;
; Two envs, one build flag apart (see docs/ARCHITECTURE.md "Bring-up"):
;   pio run -e scan   -t upload -t monitor   # identify your Watchdog first
;   pio run -e bridge -t upload -t monitor   # the real bridge, once config.h is set

[platformio]
default_envs = scan

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; OTA: two 4MB A/B app slots + rollback (was huge_app.csv, single 3MB app). nvs/otadata offsets are kept
; identical, so a cable reflash preserves creds/config. OTA can't repartition -> the switch is a ONE-TIME
; cable flash per unit; every flash after that can be wireless. See partitions_ota.csv + OTA_DMESG_NTFY_PLAN.md.
board_build.partitions = partitions_ota.csv

; This module is an ESP32-S3 N16R8: 16MB flash + 8MB OPI PSRAM (lcdwiki 2.8" S3).
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

; PSRAM ON (2026-08-29). Was OFF originally (a headless bridge didn't need it, and a wrong
; OPI setting can bootloop). Turned on because an mbedtls TLS handshake (OTA over HTTPS +
; ntfy) does NOT fit in internal SRAM on this board -- confirmed on hardware: the handshake
; OOM'd at ~28KB free heap (-32512 SSL_ALLOC_FAILED). With PSRAM the big TLS buffers move
; off internal RAM. The module is OPI -> memory_type = qio_opi. This is the SAME proven
; config as the sibling `intercom` firmware (identical board, PSRAM on, TLS OTA working).
board_build.arduino.memory_type = qio_opi

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1      ; Serial over the S3's NATIVE USB (no UART chip) -- without this the monitor is silent
  -DBOARD_HAS_PSRAM                ; enable the 8MB OPI PSRAM (mbedtls TLS buffers land here; see the note above)
lib_deps =
  h2zero/NimBLE-Arduino@^2
  adafruit/Adafruit NeoPixel@^1.12   ; onboard status LED on GPIO 42 (WS2812)

; --- Flash this FIRST. Enumerates advertising Watchdogs to serial so you can
;     identify YOUR unit by RSSI + a power-cycle. Needs no config.h, no WiFi. ---
[env:scan]
build_flags =
  ${env.build_flags}
  -DSCAN_ONLY

; --- The real bridge. Needs include/config.h (copy include/config.example.h).
;     Re-add -DVERBOSE_RAW below to dump every BLE notification as hex during
;     bring-up on a NEW unit. There's no display on the Watchdog to check against
;     (only an error-code LCD), so the hex + a self-consistency check is how you
;     validate the decode -- see LEDGER.md. Removed 2026-08-07 once validated on
;     the real xx:xx:xx:xx:xx:xx unit. ---
[env:bridge]
build_flags =
  ${env.build_flags}
  ${display.build_flags}
lib_deps =
  ${env.lib_deps}
  ${display.lib_deps}
  https://github.com/ricmoo/QRCode.git   ; scan-to-join Wi-Fi QR on the AP page

; --- FACTORY IMAGE: the "shipped" build. Identical to -e bridge, but -DFACTORY_IMAGE skips the
;     include/config.h dev-seed at COMPILE time, so NO Wi-Fi creds / Watchdog MAC / identifying
;     strings are baked into the binary (verify: `strings firmware.bin` finds none). A unit flashed
;     with this boots BLANK -> setup portal, ready for its owner to provision -- like Windows sysprep.
;     Build:  PYTHONIOENCODING=utf-8 pio run -e factory
;     A truly factory-fresh test also needs a blank NVS (esptool erase_flash, or the on-device/serial
;     factory reset) -- an existing unit's NVS survives a reflash. ---
[env:factory]
build_flags =
  ${env.build_flags}
  ${display.build_flags}
  -DFACTORY_IMAGE
lib_deps =
  ${env.lib_deps}
  ${display.lib_deps}
  https://github.com/ricmoo/QRCode.git

; --- Display bring-up (phase 2, milestone 2). A STANDALONE TFT + touch test so the
;     bridge firmware stays untouched while we prove the panel. PSRAM stays OFF: a
;     240x320 panel drives fine from internal SRAM, and LVGL (later) only needs a
;     small partial buffer -- turning PSRAM on is a milestone-3 decision, isolated.
;
;     TFT_eSPI is configured entirely by build flags here (board settings live in
;     platformio.ini -- the whole point of this project), mirroring the vendor's
;     User_Setup.h for the ILI9341V (HSPI, 40MHz, BL on GPIO45 active-HIGH) -- PLUS
;     TFT_INVERSION_ON, which the vendor setup omits but this IPS panel needs (see below).
;     FT6336 touch is vendored in lib/FT6336. The [display] block
;     is its own section so the eventual display-enabled bridge can reuse it. ---
[display]
build_flags =
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_INVERSION_ON=1            ; this IPS ILI9341V wants inversion ON -- without it every colour came out complemented (white->black, red->cyan). Confirmed on hardware 2026-08-07.
  -DTFT_MISO=13
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=46
  -DTFT_RST=-1
  -DTFT_BL=45
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DUSE_HSPI_PORT=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
lib_deps =
  bodmer/TFT_eSPI@^2.5.43

[env:disptest]
build_flags =
  ${env.build_flags}
  ${display.build_flags}
  -DDISPLAY_TEST
lib_deps =
  ${display.lib_deps}

; --- Screen scrub: LCD image-RETENTION remover (the ILI9341V is an IPS LCD, not OLED, so a
;     ghosted store-demo image is recoverable, not permanent burn-in). High-contrast full-field
;     cycling + polarity inversion lifts the ghost. Flash this, let it run 10-30 min, reflash
;     -e bridge. Standalone (no BLE/WiFi); reuses the [display] TFT config. ---
[env:scrub]
build_flags =
  ${env.build_flags}
  ${display.build_flags}
  -DSCREEN_SCRUB
lib_deps =
  ${display.lib_deps}

; --- Audio bring-up (phase 2, audible alarm). Standalone ES8311 codec + I2S "klaxon" that
;     also proves FT6336 touch survives on the SHARED I2C bus before the alarm goes into the
;     bridge. ES8311 driver is vendored in lib/ES8311 with its I2C primitives ported to Wire.
;     Needs a speaker on the board's SPK JST to hear anything. No NimBLE/WiFi. ---
[env:audiotest]
build_flags =
  ${env.build_flags}
  -DAUDIO_TEST
lib_deps =

; --- Recon: connect to the real Watchdog and dump its full GATT table to serial.
;     Groundwork for cracking the "reset energy" command the phone app uses (which
;     the public reverse-engineering never captured). Read-only + safe. ---
[env:wdinfo]
build_flags =
  ${env.build_flags}
  -DWATCHDOG_INFO

; --- Watchdog EMULATOR: impersonate the unit (name + GATT), stream canned telemetry,
;     and log every byte the phone app writes -- to capture the "reset energy" command
;     the app uses. Power the REAL unit OFF so the app connects to this fake. ---
[env:emulate]
build_flags =
  ${env.build_flags}
  -DEMULATE
